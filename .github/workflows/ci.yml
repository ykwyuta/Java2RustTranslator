name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Runtime crate tests (jrt)
        run: cargo test --workspace

      - name: Build translator and run all tests (unit, golden, e2e)
        run: ./gradlew build

      - name: Translate and run the example via the Gradle plugin
        working-directory: examples/hello-gradle
        run: ./gradlew translateToRust cargoRun
