name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Runtime crate tests (jrt)
        run: cargo test --workspace

      - name: Build translator and run all tests (unit, golden, e2e)
        run: ./gradlew build

      - name: Translate and run the example via the Gradle plugin
        working-directory: examples/hello-gradle
        run: ./gradlew translateToRust cargoRun

  # Spring Boot → Rust の移行例（examples/todo-app）。両方のテスト、j2r --framework spring の生成結果が最新であること、応答の比較。
  todo-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Spring Boot version (build and tests)
        working-directory: examples/todo-app/spring-boot
        run: ./gradlew build

      - name: The Rust version (generated by j2r) is up to date with the Spring Boot sources
        working-directory: examples/todo-app/spring-boot
        run: |
          ./gradlew translateToRust
          git diff --exit-code -- ../rust
          test -z "$(git status --porcelain -- ../rust)"

      - name: Rust version (clippy, including the translated tests)
        working-directory: examples/todo-app/rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust version (tests translated from the MockMvc tests)
        working-directory: examples/todo-app/rust
        env:
          DATABASE_URL: postgres://todo:todo@localhost:5432/todo
        run: cargo test --locked

      - name: Compare the responses of both versions
        working-directory: examples/todo-app
        run: ./compare.sh
